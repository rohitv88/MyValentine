<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Favorite Person ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: linear-gradient(
    135deg,
    #ff9a8b,
    #ffb07c,
    #ffcf9f,
    #f6a6c1,
    #c77dff
  );
  background-size: 400% 400%;
  animation: sunset 12s ease infinite;
}

@keyframes sunset {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  background: rgba(255,255,255,0.93);
  padding: 30px;
  border-radius: 25px;
  width: 380px;
  text-align: center;
  box-shadow: 0 20px 45px rgba(0,0,0,0.25);
  position: relative;
  z-index: 2;
}

img {
  width: 100%;
  border-radius: 20px;
  margin-bottom: 20px;
}

h1 {
  color: #ff6f61;
}

p {
  color: #6b4b3e;
}

/* BUTTON GROUP */
.buttons {
  margin-top: 25px;
  height: 70px;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  transform: translateX(-25px);
}

button {
  padding: 12px 24px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  color: white;
}

/* YES BUTTON (nudged further left) */
#yesBtn {
  background: linear-gradient(135deg, #ff7a5c, #ffb347);
  z-index: 2;
  transform: translateX(-25px); /* ← moved more left */
}

/* NO BUTTON */
#noBtn {
  background: linear-gradient(135deg, #b993d6, #8ca6db);
  position: absolute;
  left: 50%;
  transform: translateX(60px);
}

/* FLOATING HEARTS */
.heart {
  position: fixed;
  bottom: -30px;
  font-size: 32px;
  animation: floatUp 4s ease forwards;
  pointer-events: none;
  z-index: 1;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-120vh) scale(1.8);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container" id="card">
  <img src="us.jpg" alt="Us ❤️">

  <h1>Hi Beautifullll 💕</h1>

  <p>
    Every day with you feels special.<br>
    You make my life brighter just by being in it.
  </p>

  <p style="margin-top:15px;">
    Will you be my Valentine? 💖
  </p>

  <div class="buttons">
    <button id="yesBtn" onclick="sayYes()">Yes, always ❤️</button>
    <button id="noBtn" onmouseenter="runAway()">No 😅</button>
  </div>
</div>

<script>
function sayYes() {
  document.getElementById("card").innerHTML =
    "<h1>YAYYY 🥰</h1>" +
    "<p>I can’t wait to spend every Valentine’s Day with you for the rest of eternityyyy</p>" +
    "<p>You’re my most favorite person in the whole wide multiversee ❤️</p>";

  let interval = setInterval(createHeart, 300);
  setTimeout(() => clearInterval(interval), 6000);
}

function runAway() {
  var noBtn = document.getElementById("noBtn");
  var x = Math.random() * 260 - 130;
  var y = Math.random() * 120 - 60;
  noBtn.style.transform = "translate(" + x + "px," + y + "px)";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (3 + Math.random() * 2) + "s";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 4000);
}
</script>

</body>
</html>
